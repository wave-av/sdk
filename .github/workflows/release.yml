name: Release (public npm)

# Public-release-readiness gate for @wave-av/sdk (task #86).
#
# Trigger: pushing a `sdk-v*` git tag (e.g. `sdk-v2.1.0-next.0`). The naive
# `publish.yml` (tags: v*) publishes with NO gate; this workflow is the guarded
# path — nothing reaches public npm until three gates are green:
#   1. secret-scan  — org-standard gitleaks (pinned + checksum-verified) over the
#                     published tree + the WAVE content-policy trade-secret gate.
#   2. verify       — install + lint + type-check + unit tests + build, then an
#                     e2e-smoke that PACKS the real tarball, installs it into a
#                     throwaway project, and imports it via BOTH CJS and ESM.
#   3. publish      — only after 1+2 pass. The tag version MUST equal
#                     package.json version, and the npm dist-tag is derived from
#                     the version: prerelease (`*-next.*` / any `-` build) -> `next`,
#                     stable -> `latest`. A prerelease can therefore never take the
#                     `latest` tag by accident.

on:
  push:
    tags: ['sdk-v*']

permissions:
  contents: read

concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Gate 1 — secret scan (org standard: gitleaks + WAVE content-policy).
  # Mirrors public-repo-guard.yml so the release path enforces the SAME gate the
  # merge path does; pinned version + SHA-256 so a tampered download cannot run.
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install gitleaks (pinned + checksum-verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tar.gz
          gitleaks version

      - name: gitleaks (secret scan — published tree)
        run: gitleaks detect --no-git --source . --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: Install ripgrep
        run: command -v rg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep)

      - name: content policy (WAVE trade-secret / internal-leak gate)
        env:
          GUARD_PRIVATE_REPOS: ${{ vars.GUARD_PRIVATE_REPOS }}
        run: bash scripts/public-repo-guard/content-policy.sh .

  # ---------------------------------------------------------------------------
  # Gate 2 — build, lint, type-check, unit tests, then e2e-smoke the real tarball.
  # ---------------------------------------------------------------------------
  verify:
    name: Build + test + e2e-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      - run: npm run type-check

      - run: npm run test

      - run: npm run build

      - name: e2e-smoke — pack + install + import the published tarball
        run: |
          set -euo pipefail
          TARBALL="$(npm pack --silent | tail -n1)"
          TARBALL="$PWD/$TARBALL"
          echo "packed: $TARBALL"
          SMOKE="$(mktemp -d)"
          cd "$SMOKE"
          npm init -y >/dev/null 2>&1
          npm install --no-save "$TARBALL" >/dev/null 2>&1
          # CJS require
          node -e "const m=require('@wave-av/sdk'); if(!m||Object.keys(m).length===0){console.error('CJS import empty');process.exit(1);} console.log('CJS ok — exports:',Object.keys(m).length);"
          # ESM import
          node --input-type=module -e "import * as m from '@wave-av/sdk'; if(!m||Object.keys(m).length===0){console.error('ESM import empty');process.exit(1);} console.log('ESM ok — exports:',Object.keys(m).length);"
          # subpath export (client) resolves
          node -e "const c=require('@wave-av/sdk/client'); if(!c||Object.keys(c).length===0){console.error('client subpath empty');process.exit(1);} console.log('client subpath ok');"

  # ---------------------------------------------------------------------------
  # Gate 3 — publish. Runs ONLY if secret-scan + verify are green.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to npm (gated)
    needs: [secret-scan, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Verify tag matches package.json version + choose dist-tag
        id: ver
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF_NAME}"           # e.g. sdk-v2.1.0-next.0
          TAG_VERSION="${TAG_NAME#sdk-v}"          # e.g. 2.1.0-next.0
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag=$TAG_NAME version-from-tag=$TAG_VERSION package.json=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag $TAG_NAME implies version $TAG_VERSION but package.json is $PKG_VERSION — refusing to publish a mismatched release"
            exit 1
          fi
          case "$PKG_VERSION" in
            *-next.*) DIST_TAG=next ;;   # explicit prerelease channel
            *-*)      DIST_TAG=next ;;   # any other prerelease (rc/beta) — never 'latest'
            *)        DIST_TAG=latest ;; # stable
          esac
          echo "dist-tag=$DIST_TAG"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      - name: npm publish (dist-tag ${{ steps.ver.outputs.dist_tag }})
        run: npm publish --access public --no-provenance --tag "${{ steps.ver.outputs.dist_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
