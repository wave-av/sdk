name: Release (public npm)

# Public-release-readiness gate for @wave-av/sdk (task #86; extended 2026-09-05 to
# close VER-001 — see below).
#
# Trigger: pushing a `sdk-v*` git tag (e.g. `sdk-v2.1.0-next.0`), OR a manual
# `workflow_dispatch` naming an EXISTING `sdk-v*` tag — the backfill path. The
# dispatch path exists so a tag that was already pushed/published (e.g.
# `sdk-v2.1.3`, published before this workflow's `release` job existed) can be
# replayed idempotently: it will not re-publish a version already on npm, but it
# WILL still create the missing GitHub Release. Nothing reaches public npm or a
# GitHub Release until every gate before it is green:
#   0. resolve-ref   — resolve + strictly validate the tag (push ref or dispatch
#                      input) BEFORE it reaches any git/npm/gh command as text:
#                      format (sdk-v<semver>), existence (git rev-parse), and
#                      trust (the tag's commit must be an ancestor of origin/main)
#                      — every later job checks out that commit BY SHA, not by
#                      the (mutable) tag name.
#   1. secret-scan   — org-standard gitleaks (pinned + checksum-verified) over the
#                      published tree + the WAVE content-policy trade-secret gate.
#   2. verify        — asserts the tag's version matches package.json (fails loud
#                      on mismatch), then install + lint + type-check + unit tests
#                      + build, then an e2e-smoke that PACKS the real tarball,
#                      installs it into a throwaway project, and imports it via
#                      BOTH CJS and ESM.
#   3. publish       — only after 0+1+2 pass. Re-asserts the version match, then
#                      SKIPS `npm publish` (with a clear log line) if that exact
#                      version is already on npm — the idempotent-backfill case —
#                      otherwise publishes via OIDC trusted publishing. The npm
#                      dist-tag is derived from the version: prerelease
#                      (`*-next.*` / any `-` build) -> `next`, stable -> `latest`.
#                      A prerelease can therefore never take the `latest` tag by
#                      accident.
#   4. release       — VER-001. Creates (or, if already present, updates) the
#                      GitHub Release for the tag: generated release notes +
#                      the packed npm tarball attached. Idempotent by design so
#                      a re-run (or a backfill dispatch) never fails just
#                      because the release already exists.
#
# All version-match / already-published / release-create logic lives in
# scripts/release/*.sh — one codified, locally-runnable source of truth, not
# four hand-written copies across jobs that can drift from each other. Run
# `scripts/release/drift-check.sh` any time to see the live state; it (and this
# workflow) are the ONLY sanctioned way this repo cuts a public release —
# release-drift.yml fails loud if a release ever appears via any other path.

on:
  # A pushed tag's own commit IS the code this workflow builds/publishes — GitHub
  # scopes that run's ambient Actions-cache to `refs/tags/<tag>`, an isolated scope
  # with no relationship to `main`'s cache. CodeQL's actions/cache-poisoning query
  # is silent here for exactly that reason (see resolve-ref below for the
  # workflow_dispatch case, which does NOT get that isolation).
  push:
    tags: ['sdk-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing sdk-v* tag to (re)process, e.g. sdk-v2.1.3 — backfills a GitHub Release for a tag published before this workflow existed, or idempotently replays release for any prior tag. Publish is skipped automatically if that version is already on npm.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sdk-release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Gate 0 — resolve + strictly validate the tag before it reaches any command.
  # A dispatch input is attacker-influencable text; a full-anchored regex (not a
  # glob) refuses anything that isn't exactly `sdk-v<semver>` (mirrors the same
  # guard in sbom.yml). Beyond format, this job also proves the tag's commit
  # EXISTS and is an ANCESTOR of origin/main before any downstream job checks it
  # out — closing CodeQL actions/cache-poisoning/poisonable-step alerts #9-15
  # (a workflow_dispatch run's ambient Actions-cache scope is main's, so
  # executing an unmerged/unreviewed tag's code there could poison main's
  # cache). Outputs both `tag` (the name, for check-version.sh/gh release) and
  # `sha` (the validated commit, used for every downstream checkout) — never
  # interpolated into a shell body, only passed via env:/outputs.
  # ---------------------------------------------------------------------------
  resolve-ref:
    name: Resolve release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      # Full history + all tags — needed so `git rev-parse`/`git merge-base` below
      # can see the tag and `origin/main`. No `ref:` override: this checks out
      # whatever triggered the run (the pushed tag, or the branch a dispatch was
      # run from) — never the untrusted dispatch input — and no step here executes
      # anything from that tree (metadata reads only), so nothing below is a
      # "poisonable step" itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate the tag to release
        id: resolve
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${DISPATCH_TAG:-$PUSH_TAG}"

          # 1. Format — full-anchored regex, not a glob — refuses anything that
          #    isn't exactly `sdk-v<semver>` (mirrors the same guard in sbom.yml).
          if [[ ! "$TAG" =~ ^sdk-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::refusing to process ref '$TAG' — expected sdk-v<semver>"
            exit 1
          fi

          # 2. Existence — the tag must resolve to a real commit object in THIS
          #    repo, not just text that happens to look right.
          if ! SHA="$(git rev-parse --verify --quiet "refs/tags/${TAG}^{commit}")"; then
            echo "::error::tag '$TAG' does not exist in this repository (or does not point at a commit)"
            exit 1
          fi

          # 3. Trust (closes CodeQL actions/cache-poisoning/poisonable-step alerts
          #    #9-15 on this workflow) — a `workflow_dispatch` input is
          #    attacker-influencable text, and a dispatch run's ambient
          #    GITHUB_REF/Actions-cache scope is whatever branch it was dispatched
          #    on (normally `main`), even though the CODE this workflow goes on to
          #    execute (npm ci/build/lint/test, gitleaks, content-policy.sh) is the
          #    resolved tag's tree. Format-validity alone does not prove that tree
          #    was ever reviewed — a tag pushed off an arbitrary/unmerged branch
          #    passes the regex above just as easily. Requiring the tag's commit to
          #    be an ANCESTOR of origin/main means every later job only ever runs
          #    code that was already merged (and reviewed) on the default branch —
          #    never a bespoke, unmerged payload smuggled in via a crafted tag.
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::tag '$TAG' (commit $SHA) is not reachable from origin/main — refusing to build/publish/release an unmerged or unrecognized ref"
            exit 1
          fi

          echo "resolved tag: $TAG -> $SHA (verified: sdk-v<semver> shape, exists, ancestor of origin/main)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Gate 1 — secret scan (org standard: gitleaks + WAVE content-policy).
  # Mirrors public-repo-guard.yml so the release path enforces the SAME gate the
  # merge path does; pinned version + SHA-256 so a tampered download cannot run.
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret scan
    needs: [resolve-ref]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}
          persist-credentials: false

      - name: Install gitleaks (pinned + checksum-verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tar.gz
          gitleaks version

      - name: gitleaks (secret scan — published tree)
        run: gitleaks detect --no-git --source . --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: Install ripgrep
        run: command -v rg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep)

      - name: content policy (WAVE trade-secret / internal-leak gate)
        env:
          GUARD_PRIVATE_REPOS: ${{ vars.GUARD_PRIVATE_REPOS }}
        run: bash scripts/public-repo-guard/content-policy.sh .

  # ---------------------------------------------------------------------------
  # Gate 2 — assert the tag matches package.json, then build, lint, type-check,
  # unit tests, and e2e-smoke the real tarball.
  # ---------------------------------------------------------------------------
  verify:
    name: Build + test + e2e-smoke
    needs: [resolve-ref]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}
          persist-credentials: false

      # Release tooling (scripts/release/*) is pinned to the WORKFLOW's own ref
      # (github.sha — the tag's own commit for a tag push, or the dispatch
      # ref's head, i.e. main, for workflow_dispatch), NOT the tag checkout
      # above. A backfill dispatch can target a `sdk-v*` tag that predates
      # PR #121 (which added scripts/release/*.sh) — that tag's tree has no
      # such directory, so the helper must come from here instead. The
      # package CODE (package.json, src/, dist/) stays pinned to the tag sha
      # via the checkout above; only the tooling moves. See check-version.sh's
      # RELEASE_PKG_ROOT handling for why the env var below is required.
      - name: Checkout release tooling (workflow ref — may postdate the tag)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts/release
          persist-credentials: false
          path: .release-tooling

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Assert tag version matches package.json (VER-001 codification)
        env:
          RELEASE_PKG_ROOT: ${{ github.workspace }}
        run: .release-tooling/scripts/release/check-version.sh "${{ needs.resolve-ref.outputs.tag }}"

      - run: npm ci

      - run: npm run lint

      - run: npm run type-check

      - run: npm run test

      - run: npm run build

      - name: e2e-smoke — pack + install + import the published tarball
        run: |
          set -euo pipefail
          # --json instead of --silent: some npm versions suppress the stdout
          # filename under --silent, which would leave TARBALL empty and turn
          # the install below into an install of the workspace DIRECTORY --
          # green gate, real tarball never exercised. Parse the filename and
          # prove the .tgz exists so any regression fails loudly instead.
          TARBALL="$(npm pack --json | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0,'utf8'))[0].filename)")"
          case "$TARBALL" in
            *.tgz) ;;
            *) echo "::error::npm pack --json reported '$TARBALL', not a .tgz filename"; exit 1 ;;
          esac
          if [ ! -f "$TARBALL" ]; then
            echo "::error::npm pack reported '$TARBALL' but no such file exists"
            exit 1
          fi
          TARBALL="$PWD/$TARBALL"
          echo "packed: $TARBALL"
          SMOKE="$(mktemp -d)"
          cd "$SMOKE"
          npm init -y >/dev/null 2>&1
          npm install --no-save "$TARBALL" >/dev/null 2>&1
          # CJS require
          node -e "const m=require('@wave-av/sdk'); if(!m||Object.keys(m).length===0){console.error('CJS import empty');process.exit(1);} console.log('CJS ok — exports:',Object.keys(m).length);"
          # ESM import — a real .mjs SCRIPT FILE, not `node -e`/`--input-type=module -e`. A
          # `ReferenceError` thrown during an ES module's top-level evaluation does not reliably
          # reject the `import()` promise (or propagate as a process exit) when the importing
          # code itself was passed via `--eval`; the same error thrown from a real script file
          # reliably rejects/exits. This gate exists specifically to catch a module-level throw
          # in a shared ESM chunk (e.g. src/cli.ts's old `require.main === module` guard, fixed
          # 2026-09 — that exact bug shipped in 2.1.1/2.1.2 because this check used `-e` and
          # silently reported "ESM ok"). Do not revert this to an inline `-e` check.
          cat > "$SMOKE/esm-import-check.mjs" <<'EOF'
          process.on('unhandledRejection', (e) => { console.error('UNHANDLED', e); process.exitCode = 1; });
          const m = await import('@wave-av/sdk');
          if (!m || Object.keys(m).length === 0) {
            console.error('ESM import empty');
            process.exit(1);
          }
          console.log('ESM ok — exports:', Object.keys(m).length);
          EOF
          node "$SMOKE/esm-import-check.mjs"
          # subpath export (client) resolves
          node -e "const c=require('@wave-av/sdk/client'); if(!c||Object.keys(c).length===0){console.error('client subpath empty');process.exit(1);} console.log('client subpath ok');"

  # ---------------------------------------------------------------------------
  # Gate 3 — publish. Runs ONLY if secret-scan + verify are green. Idempotent:
  # skips `npm publish` (with a clear log line) if the exact version is already
  # on npm, so a workflow_dispatch backfill of an already-published tag (e.g.
  # sdk-v2.1.3) succeeds and still proceeds to the release job below.
  #
  # Auth: npm OIDC trusted publishing (no long-lived token). The runner mints a
  # short-lived OIDC identity token (id-token: write) and npm (>= 11.5.1) exchanges
  # it for a scoped, single-use publish credential — provided @wave-av/sdk has a
  # Trusted Publisher configured on npmjs.com (org: wave-av, repo: sdk,
  # workflow: release.yml). No NPM_TOKEN secret is used.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to npm (gated, idempotent)
    needs: [resolve-ref, secret-scan, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write   # mint the OIDC token npm exchanges for a publish credential
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}
          persist-credentials: false

      # Release tooling pinned to the workflow's own ref — see the identical
      # step (and its comment) in the `verify` job above for the full
      # rationale (backfilling a pre-#121 tag whose tree lacks scripts/release).
      - name: Checkout release tooling (workflow ref — may postdate the tag)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts/release
          persist-credentials: false
          path: .release-tooling

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 22 ships an older
      # npm. Upgrade the CLI on the runner, then prove the floor is met.
      - name: Upgrade npm to a trusted-publishing-capable CLI (>= 11.5.1)
        run: |
          set -euo pipefail
          npm install -g npm@11.19.0
          NPM_VER="$(npm --version)"
          echo "npm version: $NPM_VER"
          # The version is read from the environment, not spliced into the
          # program text: it is the output of an external command, and a
          # version that does not parse must fail CLOSED. The previous
          # comparison relied on > and <, which are both false against NaN, so
          # an unparseable string fell through the loop and exited 0 -- the
          # gate reported the CLI as trusted-publishing-capable without ever
          # having compared anything.
          # shellcheck disable=SC2016  # single-quoted on purpose: the body is a
          # JS program and ${...} inside it are template literals, not shell.
          NPM_VER="$NPM_VER" node -e '
            const raw = process.env.NPM_VER ?? "";
            const min = [11, 5, 1];
            const m = /^(\d+)\.(\d+)\.(\d+)(?:[-+].*)?$/.exec(raw.trim());
            if (!m) {
              console.error(`::error::npm reported version ${JSON.stringify(raw)}, which is not a parseable x.y.z — refusing to assume it supports trusted publishing`);
              process.exit(1);
            }
            const s = m.slice(1, 4).map(Number);
            if (!s.every(Number.isSafeInteger)) {
              console.error(`::error::npm version ${JSON.stringify(raw)} did not yield three integers`);
              process.exit(1);
            }
            for (let i = 0; i < 3; i++) {
              if (s[i] > min[i]) process.exit(0);
              if (s[i] < min[i]) {
                console.error(`::error::npm ${raw} < ${min.join(".")} — trusted publishing unavailable`);
                process.exit(1);
              }
            }
          '

      - run: npm ci

      - name: Verify tag matches package.json version + choose dist-tag
        id: ver
        env:
          RELEASE_PKG_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          .release-tooling/scripts/release/check-version.sh "${{ needs.resolve-ref.outputs.tag }}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          case "$PKG_VERSION" in
            *-next.*) DIST_TAG=next ;;   # explicit prerelease channel
            *-*)      DIST_TAG=next ;;   # any other prerelease (rc/beta) — never 'latest'
            *)        DIST_TAG=latest ;; # stable
          esac
          echo "version=$PKG_VERSION dist-tag=$DIST_TAG"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already published (idempotent backfill support)
        id: published
        run: |
          set -euo pipefail
          set +e
          .release-tooling/scripts/release/npm-published.sh "${{ steps.ver.outputs.version }}"
          RC=$?
          set -e
          case "$RC" in
            0) echo "already published — publish step will be skipped"; echo "skip=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "not yet published — will publish"; echo "skip=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::registry unreadable while checking publish state (exit $RC)"; exit "$RC" ;;
          esac

      # Auth comes from the OIDC token (id-token: write) exchanged by npm against
      # the Trusted Publisher registered for @wave-av/sdk — NO NODE_AUTH_TOKEN /
      # NPM_TOKEN / .npmrc _authToken. --provenance is now free (and enforced):
      # OIDC supplies the signing identity for the provenance attestation.
      - name: npm publish (OIDC trusted publishing, dist-tag ${{ steps.ver.outputs.dist_tag }})
        if: steps.published.outputs.skip != 'true'
        run: npm publish --access public --provenance --tag "${{ steps.ver.outputs.dist_tag }}"

      - name: Skip publish — version already on npm
        if: steps.published.outputs.skip == 'true'
        run: |
          echo "SKIP: @wave-av/sdk@${{ steps.ver.outputs.version }} is already published to npm — nothing to publish, proceeding to the release job."

  # ---------------------------------------------------------------------------
  # Gate 4 — VER-001. Create (or, if present, update) the GitHub Release for the
  # tag: generated notes + the packed npm tarball attached. Runs after publish
  # succeeds (which itself may have been a no-op skip for an already-published
  # backfill tag) so this job is the ONE place a Release gets created — no
  # workflow in this repo other than this one creates one.
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [resolve-ref, publish]
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # create/update the Release + upload the tarball asset — nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}
          persist-credentials: false

      # Release tooling pinned to the workflow's own ref — see the identical
      # step (and its comment) in the `verify` job above for the full
      # rationale (backfilling a pre-#121 tag whose tree lacks scripts/release).
      - name: Checkout release tooling (workflow ref — may postdate the tag)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts/release
          persist-credentials: false
          path: .release-tooling

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - run: npm ci

      - run: npm run build

      - name: Create or update the GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PKG_ROOT: ${{ github.workspace }}
        run: .release-tooling/scripts/release/create-github-release.sh "${{ needs.resolve-ref.outputs.tag }}"
