name: Release drift check

# Codified guard against release drift for @wave-av/sdk (VER-001 / SUPPLY-001).
# Jake's 2026-09-05 decision: release-on-tag + provenance must be codified
# workflows so state never quietly diverges. This workflow is the trip-wire:
# it runs scripts/release/drift-check.sh — the SAME script a human can run
# locally — and fails loud the moment any of these disagree:
#   - the latest stable sdk-v* git tag
#   - package.json's version on main
#   - npm registry.npmjs.org dist-tag "latest" for @wave-av/sdk
#   - existence of a GitHub Release for that latest tag
#   - presence of a provenance attestation on the published npm version
#
# Runs on every push to main (catch drift the moment it's introduced), daily
# on a schedule (catch drift introduced OUTSIDE a push — e.g. a release
# deleted by hand, or a version published from somewhere other than
# release.yml), and on workflow_dispatch for an on-demand check.
#
# Exit codes (see scripts/release/drift-check.sh): 0 = in sync, 1 = drift,
# 2 = a source was unreadable. This job fails the run on BOTH 1 and 2 — an
# unreadable registry must never be reported as "in sync".

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'   # daily, off the hour to avoid GitHub's :00 scheduler pile-up
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sdk-release-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift-check:
    name: Check tag / package.json / npm / GitHub Release / provenance are in sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0   # need full tag history, not a shallow clone
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Run the codified drift check against main + the live npm registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          scripts/release/drift-check.sh --ref origin/main
