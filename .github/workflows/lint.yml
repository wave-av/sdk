name: Lint
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      # CAP-001 — capabilities.json's exposes.sdk must match the real export surface
      # (Wave's instantiated namespaces + the barrel's off-aggregate exports). Unit
      # tests otherwise only run at release-tag time (release.yml); this specific
      # drift gate runs on every PR so a manifest/code mismatch fails fast.
      - run: npx vitest run src/__tests__/capabilities.test.ts
