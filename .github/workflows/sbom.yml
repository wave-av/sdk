# sbom.yml — generate a CycloneDX + SPDX SBOM and attach it to a GitHub Release.
#
# SUPPLY-001 (cw #4803). Measured 2026-09-03 against the live registries: @wave-av/sdk
# 2.1.3, @wave-av/mcp-server 0.2.0 and @wave-av/adk 1.0.15 all carry a signed SLSA
# provenance attestation (npm OIDC trusted publishing + `--provenance`, already in
# release.yml), but NOT ONE release in any WAVE repo has ever carried an SBOM asset —
# while mcp-server's and adk's PROVENANCE.md both declare `sbom: cyclonedx`. This
# workflow closes the half of SUPPLY-001 that provenance does not cover: a
# machine-readable bill of materials for the dependency tree an artifact was actually
# built from.
#
# ROOT CAUSE this file never ran (measured 2026-09-08: actions/workflows/sbom.yml/runs
# total_count = 0, even after 14 release.yml runs and a published sdk-v2.1.3): this
# workflow's ONLY automatic trigger was `release: published`. release.yml's `release`
# job (VER-001) is the sole place this repo creates a GitHub Release, and it does so via
# `scripts/release/create-github-release.sh` calling `gh release create` /
# `gh release upload` authenticated with `GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}` — the
# default Actions token. GitHub Actions does not fire new workflow runs for events
# produced by the default GITHUB_TOKEN (documented recursion guard), so `release:
# published` never lands for a Release this repo's own automation creates. The comment
# that used to sit here ("NO workflow in this repo creates a GitHub Release... the
# Releases that exist were cut by hand") was accurate on 2026-09-03 when this file was
# written, but went stale on 2026-09-05 when release.yml grew its `release` job — the
# trigger was never revisited against that change, and the mismatch is why sbom.yml has
# sat dormant through 14 real release runs including the sdk-v2.1.3 publish.
#
# FIX (by design, not a trigger nudge): this workflow is now `workflow_call`-callable.
# release.yml invokes it as a job (`uses: ./.github/workflows/sbom.yml`) immediately
# after its own `release` job succeeds, in the SAME run that created the Release — no
# event dispatch involved, so the GITHUB_TOKEN recursion guard is structurally
# irrelevant. The `release: published` trigger is deliberately REMOVED (not just left
# for defense-in-depth): it is dead code that would never fire for this repo's actual
# release path and would misleadingly suggest a live automatic trigger that isn't one.
# `workflow_dispatch` remains, now defaulting its `tag` input to `latest` — resolved via
# `gh release view` — so an existing release (e.g. `sdk-v2.1.3`, published before this
# fix) can be backfilled with zero arguments, without re-running release.yml's full
# build/test/e2e/publish gate chain (only the SBOM step is missing on that release; the
# artifact itself is already correct).
#
# Deliberately still a SEPARATE workflow file rather than inlined steps, even though
# release.yml now calls it directly: release.yml's `publish` job holds `id-token: write`
# for OIDC trusted publishing, and this job needs `contents: write` to upload a release
# asset. Keeping SBOM generation in its own workflow/job means the OIDC-publishing job
# never gains write access to the repo, and this job never sees the publishing identity
# — the two credentials stay in separate jobs no matter which workflow calls this one.

name: SBOM

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to generate and attach an SBOM for (e.g. sdk-v2.1.3)'
        required: true
        type: string
      sha:
        description: >-
          Commit SHA the tag resolved to at the caller's own resolve-ref step (release.yml
          already re-validates this is an ancestor of origin/main). When set, this is what
          gets checked out — never the tag name — so a tag that moves between the caller's
          resolution and this job's checkout cannot change what gets scanned. Optional: a
          bare workflow_dispatch backfill has no separate resolve-ref step and resolves its
          own SHA below instead.
        required: false
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Release tag to generate and attach an SBOM for (e.g. sdk-v2.1.3). Leave as
          "latest" (or blank) to target this repo's current latest published release —
          the backfill path for a release that predates this workflow's automatic call
          from release.yml.
        required: false
        default: 'latest'
        type: string

# Read-only by default; the one job that needs to write a release asset opts in below.
permissions:
  contents: read

# One global lock, not keyed by tag: a workflow_dispatch backfill defaults `tag` to the
# literal string 'latest', which this job only resolves to an actual tag name (e.g.
# sdk-v2.1.3) in a step below — the concurrency key is fixed at trigger time, before that
# resolution runs, so a per-tag key here would let a 'latest' dispatch and a
# release.yml-triggered call for that SAME actual tag race each other's `gh release
# upload --clobber`. SBOM jobs are infrequent (once per release, or an on-demand
# backfill) and fast, so serializing repo-wide costs nothing and removes the race
# entirely rather than trying to keep two independently-computed keys in sync.
concurrency:
  group: sdk-sbom-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sbom:
    name: Generate SBOM and attach it to the release
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the SBOM as a release asset — nothing else
    env:
      # Resolved once, here, so no `${{ }}` expression is ever interpolated into a shell
      # command below: a tag is attacker-influencable text and must reach bash only as an
      # already-quoted environment variable. `inputs.tag` is populated for BOTH
      # workflow_call and workflow_dispatch triggers.
      TAG: ${{ inputs.tag }}
    steps:
      - name: Resolve "latest" (or blank) to the repo's actual latest release tag
        if: env.TAG == '' || env.TAG == 'latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RESOLVED="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          if [ -z "$RESOLVED" ]; then
            echo "::error::could not resolve the latest release tag for $GITHUB_REPOSITORY"
            exit 1
          fi
          echo "resolved '${TAG:-<blank>}' -> $RESOLVED"
          echo "TAG=$RESOLVED" >> "$GITHUB_ENV"

      - name: Validate the tag before it reaches git or gh
        run: |
          set -euo pipefail
          if [ -z "${TAG:-}" ]; then
            echo "::error::no tag resolved from the workflow_call/workflow_dispatch input"
            exit 1
          fi
          # This repo carries BOTH tag conventions: release.yml publishes on `sdk-v*`,
          # while every GitHub Release cut so far is named `v*` (latest: v2.0.1). Accept
          # either, and refuse anything else rather than pass it to a command — a crafted
          # ref name must not be able to become shell.
          #
          # A full-anchored regex, not a `case` glob: `v[0-9]*` would happily accept
          # `v1; rm -rf /` because the trailing `*` swallows the rest. Every use below
          # quotes "$TAG", so that was defence-in-depth rather than a live hole — but a
          # guard that does not actually hold is not a guard.
          if [[ ! "$TAG" =~ ^(sdk-)?v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::refusing to run for unexpected tag '$TAG' (expected v<semver> or sdk-v<semver>)"
            exit 1
          fi
          echo "resolved tag: $TAG"

      # Pin to a commit SHA before checkout, never the (mutable) tag name — mirrors
      # release.yml's own resolve-ref job, which checks out every downstream job by SHA
      # for exactly this reason. A `workflow_call` caller (release.yml) already resolved
      # and trust-checked a SHA for this tag; use it directly. A bare workflow_dispatch
      # backfill has no such caller-resolved SHA, so it resolves its own here, via the
      # commits API — one atomic read, immediately before checkout, closing the window a
      # ref-name checkout would otherwise leave open between "validate the tag" and
      # "check it out" (in which the tag could be force-moved to point somewhere else).
      - name: Resolve the tag to a commit SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_SHA:-}" ]; then
            SHA="$INPUT_SHA"
            echo "using caller-resolved sha: $SHA"
          else
            SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
            if [ -z "$SHA" ]; then
              echo "::error::could not resolve tag '$TAG' to a commit sha"
              exit 1
            fi
            echo "resolved tag '$TAG' -> $SHA"
          fi
          echo "SHA=$SHA" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      # The SBOM must describe the tree the artifact was BUILT from, so install from the
      # committed lockfile. `npm sbom` refuses to run against an incomplete tree, which is
      # the property we want: a drifted lockfile fails the job instead of emitting a
      # bill of materials that quietly omits packages.
      - name: Install the exact locked dependency tree
        run: npm ci

      # `npm sbom` (npm >= 10.4) reads the real installed tree — no third-party scanner,
      # nothing new to pin or trust. `--omit dev` scopes the document to what actually
      # ships to consumers; the dev tree is a build-time concern, not part of the artifact.
      - name: Generate CycloneDX and SPDX SBOMs from the installed tree
        run: |
          set -euo pipefail
          npm sbom --sbom-format cyclonedx --omit dev > sbom.cyclonedx.json
          npm sbom --sbom-format spdx --omit dev > sbom.spdx.json
          ls -l sbom.cyclonedx.json sbom.spdx.json

      # Fail closed on an empty or malformed document: an unreadable SBOM attached to a
      # release is worse than none, because the verifier would count it as present.
      - name: Verify the SBOMs are well-formed and describe this version
        run: node scripts/supply-chain/validate-sbom.mjs

      # --clobber makes a re-run idempotent, so a dispatch replay repairs a bad upload
      # instead of failing on "asset already exists".
      - name: Attach the SBOMs to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" sbom.cyclonedx.json sbom.spdx.json --clobber --repo "$GITHUB_REPOSITORY"

      # Proof the asset is actually on the release — reads it back from the API rather
      # than trusting the upload's exit code.
      - name: Prove the release now carries an SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ASSETS=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name] | join(" ")')
          echo "release assets: $ASSETS"
          case "$ASSETS" in
            *sbom.cyclonedx.json*) ;;
            *) echo "::error::sbom.cyclonedx.json is not present on $TAG after upload"; exit 1 ;;
          esac
          case "$ASSETS" in
            *sbom.spdx.json*) ;;
            *) echo "::error::sbom.spdx.json is not present on $TAG after upload"; exit 1 ;;
          esac
          echo "SUPPLY-001: $TAG carries a CycloneDX and an SPDX SBOM."
