# sbom.yml — attach a CycloneDX + SPDX SBOM to every published GitHub Release.
#
# SUPPLY-001. Measured 2026-09-03 against the live registries: @wave-av/sdk 2.1.3,
# @wave-av/mcp-server 0.2.0 and @wave-av/adk 1.0.15 all carry a signed SLSA provenance
# attestation (npm OIDC trusted publishing + `--provenance`, already in release.yml), but
# NOT ONE release in any WAVE repo has ever carried an SBOM asset — while mcp-server's and
# adk's PROVENANCE.md both declare `sbom: cyclonedx`. This workflow closes the half of
# SUPPLY-001 that provenance does not cover: a machine-readable bill of materials for the
# dependency tree an artifact was actually built from.
#
# Deliberately a SEPARATE workflow rather than more steps in release.yml: release.yml is
# the publish path holding `id-token: write`, and adding an SBOM upload there would widen
# that job to `contents: write` alongside the OIDC publishing credential. Keeping SBOM
# generation in its own workflow means the publish job never gains write access to the
# repo, and this job never sees the publishing identity.
#
# Runs on `release: published` (after release.yml has published to npm) and can be replayed
# for any existing tag via workflow_dispatch — so historical releases can be backfilled
# without cutting a new version.
#
# Note on the trigger: NO workflow in this repo creates a GitHub Release — release.yml
# publishes to npm off a `sdk-v*` tag and stops there, and the Releases that exist were cut
# by hand. So `release: published` fires only when someone publishes a Release in the UI or
# via `gh release create`, and workflow_dispatch is the load-bearing path today. Both are
# wired up so this workflow starts covering releases automatically the moment the repo
# begins creating them.

name: SBOM

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to generate and attach an SBOM for (e.g. sdk-v2.1.3)'
        required: true
        type: string

# Read-only by default; the one job that needs to write a release asset opts in below.
permissions:
  contents: read

concurrency:
  group: sdk-sbom-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  sbom:
    name: Generate SBOM and attach it to the release
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the SBOM as a release asset — nothing else
    env:
      # Resolved once, here, so no `${{ }}` expression is ever interpolated into a shell
      # command below: a tag is attacker-influencable text and must reach bash only as an
      # already-quoted environment variable.
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Validate the tag before it reaches git or gh
        run: |
          set -euo pipefail
          if [ -z "${TAG:-}" ]; then
            echo "::error::no tag resolved from the event or the dispatch input"
            exit 1
          fi
          # This repo carries BOTH tag conventions: release.yml publishes on `sdk-v*`,
          # while every GitHub Release cut so far is named `v*` (latest: v2.0.1). Accept
          # either, and refuse anything else rather than pass it to a command — a crafted
          # ref name must not be able to become shell.
          #
          # A full-anchored regex, not a `case` glob: `v[0-9]*` would happily accept
          # `v1; rm -rf /` because the trailing `*` swallows the rest. Every use below
          # quotes "$TAG", so that was defence-in-depth rather than a live hole — but a
          # guard that does not actually hold is not a guard.
          if [[ ! "$TAG" =~ ^(sdk-)?v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::refusing to run for unexpected tag '$TAG' (expected v<semver> or sdk-v<semver>)"
            exit 1
          fi
          echo "resolved tag: $TAG"

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'

      # The SBOM must describe the tree the artifact was BUILT from, so install from the
      # committed lockfile. `npm sbom` refuses to run against an incomplete tree, which is
      # the property we want: a drifted lockfile fails the job instead of emitting a
      # bill of materials that quietly omits packages.
      - name: Install the exact locked dependency tree
        run: npm ci

      # `npm sbom` (npm >= 10.4) reads the real installed tree — no third-party scanner,
      # nothing new to pin or trust. `--omit dev` scopes the document to what actually
      # ships to consumers; the dev tree is a build-time concern, not part of the artifact.
      - name: Generate CycloneDX and SPDX SBOMs from the installed tree
        run: |
          set -euo pipefail
          npm sbom --sbom-format cyclonedx --omit dev > sbom.cyclonedx.json
          npm sbom --sbom-format spdx --omit dev > sbom.spdx.json
          ls -l sbom.cyclonedx.json sbom.spdx.json

      # Fail closed on an empty or malformed document: an unreadable SBOM attached to a
      # release is worse than none, because the verifier would count it as present.
      - name: Verify the SBOMs are well-formed and describe this version
        run: node scripts/supply-chain/validate-sbom.mjs

      # --clobber makes a re-run idempotent, so a dispatch replay repairs a bad upload
      # instead of failing on "asset already exists".
      - name: Attach the SBOMs to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" sbom.cyclonedx.json sbom.spdx.json --clobber --repo "$GITHUB_REPOSITORY"

      # Proof the asset is actually on the release — reads it back from the API rather
      # than trusting the upload's exit code.
      - name: Prove the release now carries an SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ASSETS=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name] | join(" ")')
          echo "release assets: $ASSETS"
          case "$ASSETS" in
            *sbom.cyclonedx.json*) ;;
            *) echo "::error::sbom.cyclonedx.json is not present on $TAG after upload"; exit 1 ;;
          esac
          case "$ASSETS" in
            *sbom.spdx.json*) ;;
            *) echo "::error::sbom.spdx.json is not present on $TAG after upload"; exit 1 ;;
          esac
          echo "SUPPLY-001: $TAG carries a CycloneDX and an SPDX SBOM."
